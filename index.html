    :root {
      --ivory: #fcf9f5;
      --beige: #f3eae0;
      --blush: #f6e2e4;
      --dusty-rose: #c98a92;
      --dusty-rose-dark: #b06f78;
      --text-main: #4a3f41;
      --text-soft: #756568;
      --card-bg: rgba(255, 253, 250, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(145deg, var(--ivory) 0%, var(--beige) 55%, var(--blush) 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle floating hearts */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      color: var(--dusty-rose);
      opacity: 0;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.9);
        opacity: 0;
      }
      15% {
        opacity: 0.35;
      }
      85% {
        opacity: 0.25;
      }
      100% {
        transform: translateY(-105vh) scale(1.1);
        opacity: 0;
      }
    }

    /* Main container */
    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .screen {
      display: none;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .screen.active {
      display: block;
    }

    .screen.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Typography */
    .serif {
      font-family: "Georgia", "Times New Roman", "Palatino Linotype", serif;
    }
